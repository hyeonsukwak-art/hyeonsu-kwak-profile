<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>곽현수 | 자기소개</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    color: #222;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 48px 40px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #2563eb;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2em;
    font-weight: 700;
    margin: 0 auto 20px;
  }
  h1 {
    font-size: 1.6em;
    margin: 0 0 4px;
  }
  .dept {
    display: inline-block;
    background: #e8f0fe;
    color: #2563eb;
    font-size: 0.85em;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  .tagline {
    color: #555;
    font-size: 0.98em;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .section-title {
    font-size: 0.8em;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .likes {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .likes span {
    background: #f1f3f5;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 0.92em;
  }
  footer {
    margin-top: 32px;
    font-size: 0.75em;
    color: #bbb;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">곽</div>
    <h1>곽현수</h1>
    <div class="dept">SCM</div>
    <p class="tagline">"오늘도 효율적으로, 내일은 더 효율적으로"</p>

    <div class="section-title">좋아하는 것</div>
    <div class="likes">
      <span>☕ 커피</span>
      <span>🎮 게임</span>
      <span>😴 잠</span>
    </div>

    <footer>© 2026 Hyeonsu Kwak</footer>
  </div>
</body>
</html>
